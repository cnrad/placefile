# Alternative host: Bun on Fly.io with a persistent volume.
#   fly launch --copy-config --no-deploy
#   fly volumes create data --size 1
#   fly deploy
app = "profile-place"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  PORT = "3000"
  PROFILE_URL = "https://github.com/YOUR_GITHUB_USERNAME"
  COOLDOWN_MS = "1000"
  TRUSTED_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[mounts]
  source = "data"
  destination = "/data"
