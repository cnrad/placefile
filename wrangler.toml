name = "placefile"
main = "src/worker.ts"
compatibility_date = "2025-10-01"

[vars]
# Minimum time between accepted clicks from one visitor, in ms.
COOLDOWN_MS = "1000"

[[durable_objects.bindings]]
name = "CANVAS"
class_name = "Canvas"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Canvas"]

[observability]
enabled = true
